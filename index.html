<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <div id="kwentahanan">
        <div class="min-w-2xl min-h-3xl">
            <div class="flex justify-center p-5 mt-10  lg:block sm:hidden md:hidden block">
                <div class="flex justify-center">
                    <div
                        class="w-full h-fit rounded-[10%] shadow-xl lg:w-fit p-10  cursor-pointer bg-rose-700 border-5 border-black  shadow-4xl shadow-rose-950">
                        <div class="">
                            <input v-model="typingboard" type="text" placeholder="0"
                                class="bg-gray-200 w-full  h-15 lg:w-fit lg:h-18 rounded-2xl border border-white font-bold  text-2xl cursor-pointer p-5 text-right text-red-700">
                        </div>
                        <div class="flex justify-between w-full lg:w-fit  items-center gap-5 ">
                            <div>
                                <button @click="cancel('ac')"
                                    class="bg-gray-300 w-30 h-15 lg:w-40 lg:h-18 rounded-2xl border border-white mt-5 text-2xl text-black cursor-pointer hover:bg-gray-500 ">AC</button>
                            </div>
                            <button @click="numbersOperator('%')"
                                class="bg-gray-300 lg:w-20 lg:h-18 w-20 h-15 rounded-2xl border border-white mt-5 text-2xl text-black cursor-pointer hover:bg-gray-500 ">%</button>
                            <button @click="numbersOperator('/')"
                                class=" w-20 h-15 lg:w-20 lg:h-18 rounded-2xl border border-white mt-5 text-2xl text-black bg-gray-50 cursor-pointer  hover:bg-gray-300">/</button>
                        </div>
                        <div class="flex gap-5">
                            <button @click="numbers('7')"
                                class="bg-gray-300 lg:w-20 lg:h-18 w-20 h-15 rounded-xl border border-white mt-5 text-2xl text-black cursor-pointer hover:bg-gray-500">7</button>
                            <button @click="numbers('8')"
                                class="bg-gray-300 lg:w-20 lg:h-18 w-20 h-15 rounded-xl border border-white mt-5 text-2xl text-black cursor-pointer hover:bg-gray-500">8</button>
                            <button @click="numbers('9')"
                                class="bg-gray-300 lg:w-20 lg:h-18 w-20 h-15 rounded-xl border border-white mt-5 text-2xl text-black cursor-pointer hover:bg-gray-500">9</button>
                            <button @click="numbersOperator('*')"
                                class="w-20 h-15 lg:w-20 lg:h-18 rounded-xl border border-white mt-5 text-2xl text-black bg-gray-50 cursor-pointer  hover:bg-gray-300 font-bold">*</button>
                        </div>
                        <div class="flex gap-5">
                            <button @click="numbers('4')"
                                class="bg-gray-300 lg:w-20 lg:h-18 w-20 h-15 rounded-xl border border-white mt-5 text-2xl text-black cursor-pointer hover:bg-gray-500">4</button>
                            <button @click="numbers('5')"
                                class="bg-gray-300 lg:w-20 lg:h-18 w-20 h-15 rounded-xl border border-white mt-5 text-2xl text-black cursor-pointer hover:bg-gray-500">5</button>
                            <button @click="numbers('6')"
                                class="bg-gray-300 lg:w-20 lg:h-18 w-20 h-15 rounded-xl border border-white mt-5 text-2xl text-black cursor-pointer hover:bg-gray-500">6</button>
                            <button @click="numbersOperator('+')"
                                class="w-20 h-15 lg:w-20 lg:h-18 rounded-xl border border-white mt-5 text-2xl text-black bg-gray-50 cursor-pointer  hover:bg-gray-300 font-bold">+</button>
                        </div>
                        <div class="flex gap-5">
                            <button @click="numbers('1')"
                                class="bg-gray-300 lg:w-20 lg:h-18 w-20 h-15 rounded-xl border border-white mt-5 text-2xl text-black cursor-pointer hover:bg-gray-500">1</button>
                            <button @click="numbers('2')"
                                class="bg-gray-300 lg:w-20 lg:h-18 w-20 h-15 rounded-xl border border-white mt-5 text-2xl text-black cursor-pointer hover:bg-gray-500">2</button>
                            <button @click="numbers('3')"
                                class="bg-gray-300 lg:w-20 lg:h-18 w-20 h-15 rounded-xl border border-white mt-5 text-2xl text-black cursor-pointer hover:bg-gray-500">3</button>
                            <button @click="numbersOperator('-')"
                                class="lg:w-20 lg:h-18 w-20 h-15 rounded-xl border border-white mt-5 text-2xl text-black bg-gray-50 cursor-pointer hover:bg-gray-300 font-bold">-</button>
                        </div>
                        <div class="flex gap-5">
                            <button @click="numbers('0')"
                                class="bg-gray-300 w-50 h-15 lg:w-60 lg:h-18 rounded-xl border border-white mt-5 text-2xl text-black cursor-pointer hover:bg-green-300">0</button>
                            <button @click="equalOperator('=')"
                                class="w-20 h-15 lg:w-30 lg:h-18 rounded-xl border border-white mt-5 text-2xl text-black bg-gray-50 cursor-pointer hover:bg-mauve-500 font-bold">=</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>


    </div>

    <script>
        Vue.createApp({
            data() {
                return {
                    typingboard: "",
                    currentInput: "",
                    operator: "",
                    firstNum: 0,
                    success: "",
                    secondNum: 0,
                }
            },
            methods: {
                numbers(value) {
                    this.currentInput += value;
                    this.typingboard = this.currentInput;
                },

                numbersOperator(op) {
                    if (this.operator === "" && this.currentInput !== "") {
                        this.firstNum = parseFloat(this.currentInput);
                    } else {
                        this.stepsToCalculate();
                    }

                    this.operator = op;
                    this.currentInput = '';
                    this.typingboard = this.firstNum;

                },
                stepsToCalculate() {

                    this.secondNum = parseFloat(this.currentInput);

                    if (this.operator === "/" && this.secondNum === 0) {
                        this.typingboard = "Error";
                        return false;
                    }

                    if (this.secondNum) {
                        switch (this.operator) {

                            case "+":
                                this.firstNum = this.firstNum + this.secondNum;
                                break;
                            case "-":
                                this.firstNum = this.firstNum - this.secondNum;
                                break;
                            case "*":
                                this.firstNum = this.firstNum * this.secondNum;
                                break;
                            case "/":
                                this.firstNum = this.firstNum / this.secondNum;
                                break;
                            default: this.firstNum = this.secondNum
                        }

                        this.currentInput = "";
                        this.typingboard = this.firstNum;
                        return true;
                    }
                },

                equalOperator() {

                    this.success = this.stepsToCalculate();
                    if (!this.success) {
                        return;
                    }

                    this.operator = "";
                },

                cancel() {
                    this.currentInput = "";
                    this.typingboard = "";

                    this.firstNum = "";
                    this.secondNum = "";
                    this.operator = "";

                }






            }
        }).mount('#kwentahanan')

    </script>
</body>

</html>
